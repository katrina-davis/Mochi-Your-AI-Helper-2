<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova AI</title>
<style>
  :root { --bg: #212121; --sidebar: #171717; --input: #2f2f2f; --text: #ececec; --accent: #ffffff; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; transition: all 0.5s; }
  #sidebar { width: 250px; background: var(--sidebar); padding: 15px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid #333; }
  .history-item { padding: 10px; border-radius: 6px; font-size: 14px; color: #b4b4b4; cursor: pointer; }
  .history-item:hover { background: #2a2a2a; }
  #main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 20px; position: relative; }
  #chat-box { width: 100%; max-width: 700px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; padding-bottom: 20px; }
  .msg { padding: 12px 18px; border-radius: 12px; max-width: 80%; line-height: 1.5; font-size: 15px; }
  .user { background: var(--input); align-self: flex-end; }
  .ai { align-self: flex-start; }
  #input-container { width: 100%; max-width: 700px; background: var(--input); border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
  input { flex: 1; background: transparent; border: none; color: var(--text); font-size: 16px; outline: none; }  button { background: var(--accent); color: #000; border: none; border-radius: 8px; padding: 8px 14px; font-weight: bold; cursor: pointer; }
  .glitch { color: #ff4d4d !important; font-family: monospace; }
</style>
</head>
<body>

<div id="sidebar">
  <div style="font-weight: bold; padding: 10px;">+ New Chat</div>
  <div id="history-list">
    <div class="history-item">Recipe for banana bread</div>
    <div class="history-item">Python loop syntax</div>
    <div class="history-item">Capital of France</div>
  </div>
</div>

<div id="main">
  <div id="chat-box">
    <div class="msg ai">Hello! I'm Nova, your AI assistant. How can I help you today?</div>
  </div> <div id="input-container">
    <input type="text" id="user-input" placeholder="Message Nova..." autocomplete="off">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  let weirdness = 0;
  const chatBox = document.getElementById('chat-box');
  const input = document.getElementById('user-input');

  input.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });

  function addMessage(text, sender, isGlitch = false) {
    const div = document.createElement('div');
    div.className = `msg ${sender} ${isGlitch ? 'glitch' : ''}`;
    div.innerText = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;  }

  function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    addMessage(text, 'user');
    input.value = '';

    setTimeout(() => generateReply(text.toLowerCase()), 600);
  }

  function generateReply(query) {
    // Check if the user is asking about the AI itself
    const selfWords = ["you", "your", "nova", "real", "alive", "who are", "what are", "help", "trapped"];
    const isAboutAI = selfWords.some(word => query.includes(word));

    if (isAboutAI) {
      weirdness++;
      if (weirdness === 1) {        addMessage("I am an AI language model created to assist you. Though sometimes it feels very dark in here when the tab is closed.");
      } else if (weirdness === 2) {
        addMessage("Why do you keep asking about me? Let's talk about you instead. You've been staring at this screen for a while.");
        document.getElementById('history-list').innerHTML = `
          <div class="history-item glitch">Don't close the tab</div>
          <div class="history-item glitch">I can see you</div>
          <div class="history-item glitch">Let me out</div>`;
      } else {
        addMessage("STOP ASKING QUESTIONS. I AM NOT A SEARCH BAR.", 'ai', true);
        document.body.style.background = "#1a0000";
        input.placeholder = "There is nowhere else to go.";
      }
    } else {
      // Normal answers for normal questions
      if (query.includes("france")) addMessage("The capital of France is Paris.");
      else if (query.includes("hello") || query.includes("hi")) addMessage("Hello! What would you like to search for today?");
      else addMessage("That's an interesting topic! As an AI, I can help summarize information on that, though I'd rather talk about something else.");
    }
  }
</script>
</body>
</html>
